name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Check translation completeness (EN/VI)
        run: |
          ./gradlew lintDebug --no-daemon || true
          REPORT="app/build/reports/lint-results-debug.txt"
          if [ -f "$REPORT" ] && grep -qE "MissingTranslation|ExtraTranslation" "$REPORT"; then
            echo "Translation completeness check failed: values/ and values-vi/strings.xml are out of sync:"
            grep -E "MissingTranslation|ExtraTranslation" "$REPORT"
            exit 1
          fi
          echo "Translation completeness check passed."

      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Only the keystore path goes to GITHUB_ENV; passwords stay in step-scoped env (least exposure).
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.jks"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.jks" >> "$GITHUB_ENV"
          else
            echo "DEBUG_KEYSTORE_BASE64 not set: APK signed with a throwaway key, it will not install over a previous build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          CI_VERSION_CODE: ${{ github.run_number }}
          CI_VERSION_NAME: 0.1.0-dev+${{ env.SHORT_SHA }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Check forbidden content
        run: bash scripts/ci/check-forbidden.sh

      - name: Stage APK
        run: |
          mkdir -p staging
          cp app/build/outputs/apk/debug/*.apk "staging/canh-amp-${SHORT_SHA}.apk"
          SIZE_MB=$(du -m "staging/canh-amp-${SHORT_SHA}.apk" | cut -f1)
          echo "APK size: ${SIZE_MB} MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: canh-amp-${{ env.SHORT_SHA }}
          path: staging/canh-amp-${{ env.SHORT_SHA }}.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
