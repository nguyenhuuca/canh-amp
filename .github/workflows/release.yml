name: Release

# Manually triggered from GitHub UI: tests, builds APK, tags the commit,
# generates changelog, and publishes a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the leading v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write   # needed to create tag and release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION': expected MAJOR.MINOR.PATCH (e.g. 1.0.0)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so changelog can diff against previous tag

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI_VERSION_CODE: ${{ github.run_number }}
          CI_VERSION_NAME: ${{ inputs.version }}

      - name: Check forbidden content
        run: bash scripts/ci/check-forbidden.sh

      - name: Stage APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/canh-amp-${VERSION}.apk"

      - name: Generate release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "## What's Changed"
            echo
            if [ -n "$prev_tag" ]; then
              git log --no-merges --pretty='- %s' "${prev_tag}..HEAD"
              echo
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${prev_tag}...v${VERSION}"
            else
              git log --no-merges --pretty='- %s'
            fi
          } > release/notes.md
          cat release/notes.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "v${{ env.VERSION }}"
          body_path: release/notes.md
          files: release/canh-amp-${{ env.VERSION }}.apk
